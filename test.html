<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Text Example</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #262c36;
    }
    h1 {
      font-size: 80px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      background: linear-gradient(90deg, #2e2e8c, #4a77d4, #24d1c5, #5e6be5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <h1>Francesco</h1>
</body>
</html>
