<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acknowledgement</title>
    <link rel="stylesheet" href="style_ringraziamenti.css">
</head>
<body>
    <div class="container">
        <!-- Form Wrapper -->
        <div class="form-wrapper" id="formWrapper">
            <h1 class="title">Ringraziamenti</h1>
            <form id="acknowledgementForm" onsubmit="handleSubmit(event)">
                <input 
                    type="text" 
                    id="name" 
                    placeholder="Nome" 
                    class="input-field" 
                    required 
                >
                <input 
                    type="text" 
                    id="surname" 
                    placeholder="Cognome" 
                    class="input-field" 
                    required 
                >
                <div class="input-group">
                    <input 
                        type="password" 
                        id="pin" 
                        placeholder="PIN" 
                        class="input-field" 
                        required 
                    >
                    <span id="error-message" class="error-message" hidden>Wrong Credential</span>
                </div>
                <button 
                    type="submit" 
                    class="submit-button"
                >
                    Enter
                </button>
            </form>
        </div>

        <!-- Acknowledgment Text without extra container -->
        <!-- <div id="ringraziamenti_group" class="scrollable-text" style="display: none;">

        </div> -->
        <div id="ringraziamenti" class="scrollable-text" style="display: none;">
            <h2 id="welcomeTextGroup" class="welcome-text"></h2>
            <div id="typingTextGroup" class="typing-text"></div>
            <h2 id="welcomeText" class="welcome-text"></h2>
            <div id="typingText" class="typing-text"></div>
        </div>

    </div>

    <script src="functions.js"></script>
</body>
</html>
